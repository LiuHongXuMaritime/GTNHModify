            "com.github.GTNewHorizons:BuildCraft:7.1.40",
            "com.github.GTNewHorizons:ProjectRed:4.11.0-GTNH",
            "com.github.GTNewHorizons:Galacticraft:3.2.6-GTNH",
            "com.github.GTNewHorizons:ForestryMC:4.9.20",
            // GTNHLib 0.7.x 移除了 TargetedMod，NEID 2.1.7 仍引用它；0.6.30 是同时含 IMixins + TargetedMod 的最高版本
            "com.github.GTNewHorizons:GTNHLib:0.6.30",
            "com.github.GTNewHorizons:WirelessCraftingTerminal:1.12.0",
            "com.github.GTNewHorizons:ForgeMultipart:1.7.5",
            "com.github.GTNewHorizons:CodeChickenCore:1.4.22",
            "com.github.GTNewHorizons:ironchest:6.1.0",
            // GT5 5.09.50.60 声明的旧传递依赖已被 Nexus 清理，统一到现存版本
            "com.github.GTNewHorizons:StructureLib:1.3.6",
            "com.github.GTNewHorizons:NotEnoughItems:2.6.53-GTNH",
            "com.github.GTNewHorizons:ModularUI:1.2.17",
            "com.github.GTNewHorizons:ModularUI2:2.1.16-1.7.10",
            "com.github.GTNewHorizons:waila:1.8.2",
            "com.github.GTNewHorizons:ThaumicTinkerer:2.11.0",
            "com.github.GTNewHorizons:Mobs-Info:0.5.0-GTNH",
            "com.github.GTNewHorizons:Avaritia:1.57",
            "com.github.GTNewHorizons:AppleCore:3.3.4",
            "com.github.GTNewHorizons:EnderIO:2.8.22",
            "com.github.GTNewHorizons:Railcraft:9.16.0",
            "com.github.GTNewHorizons:AE2FluidCraft-Rework:1.4.23-gtnh",
            "com.github.GTNewHorizons:Applied-Energistics-2-Unofficial:rv3-beta-525-GTNH",
            // 锁定 GT5 到 GalaxySpace 1.1.96 编译所用的 5.09.50.60
            "com.github.GTNewHorizons:GT5-Unofficial:5.09.50.60",
            "com.github.GTNewHorizons:TinkersConstruct:1.12.16-GTNH"
        )
    }
    // Baubles 已从 Nexus 删除，项目源码未引用
    exclude group: "com.github.GTNewHorizons", module: "Baubles"
}

dependencies {
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:NotEnoughItems:2.6.52-GTNH:dev")

    // GalaxySpace 1.1.96 / Intergalactic 1.4.23 面向 GT5 5.09.50.6x 编译；
